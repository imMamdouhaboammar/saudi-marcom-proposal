name: skill-pack-ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Agent configuration security gate
        run: python scripts/security_gate.py

      - name: Validate pack
        run: python scripts/validate_pack.py

      - name: Validate eval schema
        run: python scripts/run_static_evals.py

      - name: Run unit tests
        run: python -m unittest discover -s tests
