name: Validate Skill Pack

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install -r requirements.txt

      - name: Run focused security regression scan
        run: python scripts/security_scan.py

      - name: Validate package
        run: python scripts/validate_pack.py

      - name: Validate static eval corpus
        run: python scripts/run_static_evals.py

      - name: Validate runtime adapter compatibility
        run: python scripts/validate_runtime_adapters.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
