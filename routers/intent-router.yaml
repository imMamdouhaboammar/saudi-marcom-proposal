version: 2
modes:
  FULL_BID:
    signals: ["عرض فني ومالي", "technical and financial proposal", "RFP response", "tender response"]
  TECHNICAL_ONLY:
    signals: ["عرض فني", "technical proposal", "methodology", "scope of work"]
  FINANCIAL_ONLY:
    signals: ["عرض مالي", "financial proposal", "BOQ", "pricing workbook"]
  REVIEW_ONLY:
    signals: ["review proposal", "audit bid", "راجع العرض", "submission ready"]
  DISCOVERY_DRAFT:
    signals: ["no RFP yet", "meeting notes", "rough brief", "مفيش كراسة", "brief only"]
  BARE_QUOTE:
    signals: ["one-line quote", "سطر سعر", "format this price only"]
  OUT_OF_DOMAIN:
    signals: ["civil works", "MEP tender", "reinforced concrete", "HVAC engineering tender"]

precedence:
  - OUT_OF_DOMAIN
  - BARE_QUOTE
  - REVIEW_ONLY
  - FULL_BID
  - TECHNICAL_ONLY
  - FINANCIAL_ONLY
  - DISCOVERY_DRAFT

entry_routes:
  FULL_BID: source-intake
  TECHNICAL_ONLY: source-intake
  FINANCIAL_ONLY: source-intake
  REVIEW_ONLY: proposal-qc
  DISCOVERY_DRAFT: source-intake
  BARE_QUOTE: minimal-formatting
  OUT_OF_DOMAIN: do-not-trigger

rules:
  - "A finished file review may begin at proposal-qc, but reconstruct enough source and requirement context to judge it."
  - "A partial brief never becomes a final priced bid through inference."
  - "When the user explicitly requests a minimal quote, do not launch the proposal DAG."
