name: Validate Skill Pack

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate package
        run: python scripts/validate_pack.py

      - name: Validate static eval corpus
        run: python scripts/run_static_evals.py

      - name: Validate runtime adapter compatibility
        run: python scripts/validate_runtime_adapters.py

      - name: Run focused security regression scan
        run: python scripts/security_scan.py

      - name: Run unit tests
        run: python -m unittest tests/test_validate_pack.py
